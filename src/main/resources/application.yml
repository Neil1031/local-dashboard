server:
  address: 127.0.0.1
  port: 43871
spring:
  application:
    name: local-dashboard
dashboard:
  history:
    database-path: data/local-dashboard.db
    busy-timeout-ms: 2000
  scheduler:
    # Empty means monitor nothing. Copy config/application.example.yml to opt in.
    include: []
    exclude: []
    missed-grace-minutes: 15
    timeout-seconds: 30
