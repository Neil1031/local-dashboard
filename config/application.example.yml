dashboard:
  runner:
    # Set this to the private Stage 5A runner.json deployed with the Runner.
    # Leave empty until its location is known. The browser cannot select a path.
    config-path: ""
    # Exact pilot mapping is provided by the packaged application default.
    # To expand coverage, define the full mappings list here.
  history:
    database-path: data/local-dashboard.db
    busy-timeout-ms: 2000
  scheduler:
    include:
      - '\InsiderTracker-Market'
      - '\InsiderTracker-SEC'
      - '\InsiderTracker-SyncImport'
      - '\AIStockHunter-UnexplainedVolume-Daily'
      - '\AIStockHunter-Accumulation-Weekly-Check'
      - '\AIStockHunter-Accumulation-Check-*'
    exclude: []
    missed-grace-minutes: 15
    timeout-seconds: 30
