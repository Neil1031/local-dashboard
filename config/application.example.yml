dashboard:
  sources:
    taiwan:
      enabled: false
      # Trusted absolute Python executable and fixed export_tw_readonly.py; source owns all reads.
      # py.exe uses the fixed -3.11 selector. No runtime dependency installation or shell.
      python-path: ""
      cli-path: ""
      # Explicit Stage 4 source-owned Reports CLI; never inferred from the Stocks CLI.
      reports-cli-path: ""
      # History LIST only; separate fixed export_tw_history.py path.
      history-cli-path: ""
      # Fixed source-owned observed Performance CLI.
      performance-cli-path: "F:/AI workspace/ai-stock-hunter/export_tw_observed_performance.py"
      database-path: ""
      output-dir: ""
      timeout-seconds: 10 # 1..30
    insider:
      enabled: false
      # Set local absolute paths to the trusted Insider CLI executable and existing schema-2 DB.
      # No shell, arbitrary arguments, initialization or migration. WAL is refused by the source.
      cli-path: ""
      database-path: ""
      timeout-seconds: 10 # 1..30; invalid configuration returns UNAVAILABLE
  runner:
    # Set this to the private Stage 5A runner.json deployed with the Runner.
    # Leave empty until its location is known. The browser cannot select a path.
    config-path: ""
    # Exact pilot mapping is provided by the packaged application default.
    # To expand coverage, define the full mappings list here.
  history:
    database-path: data/local-dashboard.db
    busy-timeout-ms: 2000
  scheduler:
    include:
      - '\InsiderTracker-Market'
      - '\InsiderTracker-SEC'
      - '\InsiderTracker-SyncImport'
      - '\AIStockHunter-UnexplainedVolume-Daily'
      - '\AIStockHunter-Accumulation-Weekly-Check'
      - '\AIStockHunter-Accumulation-Check-*'
    exclude: []
    missed-grace-minutes: 15
    timeout-seconds: 30
